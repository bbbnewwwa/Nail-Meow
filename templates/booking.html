<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись - Nail Meow</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="logo">🐱 Nail Meow</div>
            <ul>
                <li><a href="/">Главная</a></li>
                <li><a href="/services">Услуги</a></li>
                <li><a href="/booking" class="active">Запись</a></li>
                <li><a href="/contacts">Контакты</a></li>
                <li><a href="/admin" class="btn-admin">Админ</a></li>
            </ul>
        </nav>
    </header>
    <section class="page-header">
        <h1>Онлайн запись</h1>
        <p>Запишитесь на удобное время</p>
    </section>
    <section class="booking-container">
        <form id="bookingForm" class="booking-form">
            <label>
                Услуга:
                <select id="service" required>
                    <option value="">Выберите услугу</option>
                    <option value="1">Наращивание - 1000 ₽</option>
                    <option value="2">Снятие - 500 ₽</option>
                    <option value="3">Покрытие - 800 ₽</option>
                </select>
            </label>
            
            <label>
                Дата и время:
                <input type="datetime-local" id="appointmentDate" required>
            </label>
            
            <label>
                Ваше имя:
                <input type="text" id="clientName" required placeholder="Иванова Мария">
            </label>
            
            <label>
                Телефон:
                <input type="tel" id="clientPhone" required placeholder="+7 (999) 123-45-67">
            </label>
            
            <label>
                Комментарий:
                <textarea id="comment" placeholder="Пожелания к мастеру"></textarea>
            </label>
            
            <button type="submit" class="btn-submit">Записаться</button>
        </form>
        <div class="booking-info">
            <h3>Или запишитесь через Telegram</h3>
            <p>Быстрее и удобнее!</p>
            <a href="https://t.me/nailmeow_bot" target="_blank" class="btn-telegram">
                Перейти в бот
            </a>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 Nail Meow. Все права защищены.</p>
        <p>📍 г. Красноярск, ул. Матросова, 20, каб. 101</p>
    </footer>
    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
</body>
</html>
